{% extends "base.html" %}

{% block title %}Send Money{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <h2 class="mb-4">
                💸 Send Money
            </h2>

            <form
                method="POST"
                action="{{ url_for('send_money') }}">

                <!-- Receiver Email -->

                <div class="mb-3">

                    <label class="form-label">

                        Receiver Email

                    </label>

                    <input
                        type="email"
                        name="receiver_email"
                        class="form-control"
                        value="{{ receiver_email_prefill }}"
                        placeholder="Enter receiver email"
                        required>

                </div>

                <!-- Amount -->

                <div class="mb-3">

                    <label class="form-label">

                        Amount

                    </label>

                    <input
                        type="number"
                        step="0.01"
                        min="1"
                        name="amount"
                        class="form-control"
                        placeholder="Enter amount"
                        required>

                </div>

                <!-- UPI PIN -->

                <div class="mb-3">

                    <label class="form-label">

                        UPI PIN

                    </label>

                    <input
                        type="password"
                        name="upi_pin"
                        class="form-control"
                        maxlength="4"
                        pattern="\d{4}"
                        placeholder="Enter 4-digit UPI PIN"
                        required>

                </div>

                <!-- Submit Button -->

                <button
                    class="btn btn-success w-100">

                    Send Money

                </button>

            </form>

            <br>

            <a
                href="{{ url_for('dashboard') }}"
                class="btn btn-secondary w-100">

                ⬅ Back to Dashboard

            </a>

        </div>

    </div>

</div>

{% endblock %}
