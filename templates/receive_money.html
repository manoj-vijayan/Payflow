{% extends "base.html" %}

{% block title %}Receive Money | PayFlow{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="card shadow-sm p-4 mx-auto" style="max-width:500px;">

        <h2 class="mb-4 text-center">📥 Request Money</h2>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Request From (Email)</label>
                <input type="email"
                       name="sender_email"
                       class="form-control"
                       placeholder="Enter sender email"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Amount</label>
                <input type="number"
                       name="amount"
                       class="form-control"
                       placeholder="Enter amount"
                       min="1"
                       step="0.01"
                       required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Send Request
            </button>

        </form>

        <a href="{{ url_for('dashboard') }}"
           class="btn btn-secondary w-100 mt-3">
           ← Back to Dashboard
        </a>

    </div>

</div>

{% endblock %}
