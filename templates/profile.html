{% extends "base.html" %}

{% block title %}My Profile | PayFlow{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow-lg p-4">

                <!-- ==========================
                     Heading
                =========================== -->

                <h2 class="text-center mb-4">

                    👤 My Profile

                </h2>

                <!-- ==========================
                     Profile Picture
                =========================== -->

                <div class="text-center mb-4">

                    <img

                        src="{{ url_for('static', filename='images/avatar.png') }}"

                        alt="Profile Picture"

                        class="profile-avatar">

                </div>

                <!-- ==========================
                     Profile Form
                =========================== -->

                <form

                    action="{{ url_for('profile') }}"

                    method="POST"

                    enctype="multipart/form-data">

                    <!-- ==========================
                         Upload Image
                    =========================== -->

                    <div class="mb-4 text-center">

                        <label class="form-label fw-bold">

                            Change Profile Picture

                        </label>

                        <input

                            type="file"

                            name="profile_image"

                            class="form-control"

                            accept=".png,.jpg,.jpeg,.webp">

                        <small class="text-muted">

                            Allowed formats:
                            PNG, JPG, JPEG, WEBP
                            (Maximum 2 MB)

                        </small>

                    </div>

                    <!-- ==========================
                         Full Name
                    =========================== -->

                    <div class="mb-3">

                        <label class="form-label">

                            Full Name

                        </label>

                        <input

                            type="text"

                            name="fullname"

                            class="form-control"

                            value="{{ user['fullname'] }}"

                            required>

                    </div>

                    <!-- ==========================
                         Email
                    =========================== -->

                    <div class="mb-3">

                        <label class="form-label">

                            Email

                        </label>

                        <input

                            type="email"

                            class="form-control"

                            value="{{ user['email'] }}"

                            readonly>

                    </div>

                    <!-- ==========================
                         Phone
                    =========================== -->

                    <div class="mb-3">

                        <label class="form-label">

                            Phone Number

                        </label>

                        <input

                            type="text"

                            name="phone"

                            class="form-control"

                            value="{{ user['phone'] }}"

                            required>

                    </div>

                    <!-- ==========================
                         Country
                    =========================== -->

                    <div class="mb-3">

                        <label class="form-label">

                            Country

                        </label>

                        <input

                            type="text"

                            name="country"

                            class="form-control"

                            value="{{ user['country'] }}"

                            required>

                    </div>

                    <!-- ==========================
                         Wallet Balance
                    =========================== -->

                    <div class="mb-4">

                        <label class="form-label">

                            Wallet Balance

                        </label>

                        <input

                            type="text"

                            class="form-control"

                            value="₹{{ '%.2f'|format(user['balance']) }}"

                            readonly>

                    </div>

                    <!-- ==========================
                         Save Button
                    =========================== -->

                    <button

                        type="submit"

                        class="btn btn-primary w-100">

                        💾 Save Changes

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
